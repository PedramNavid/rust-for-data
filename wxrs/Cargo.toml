[package]
name = "wxrs"
version = "0.1.0"
edition = "2021"

# Dependency versions are pinned exactly and Cargo.lock is committed, so the
# code and benchmarks printed in the book match what you get when you build it.
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
polars = { version = "=0.54.4", features = ["lazy", "csv", "strings"] }
reqwest = { version = "=0.13.4", features = ["blocking", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
